name: aws-nginx-cicd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose action: apply or destroy'
        required: true
        default: 'destroy'
        type: choice
        options:
          - apply
          - destroy

jobs:
  terraform:
    name: Terraform Deployment
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.action == 'apply' || github.event_name != 'workflow_dispatch' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.3.0
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Capture Outputs
        run: |
          INSTANCE_ID=$(terraform output -raw instance_id)
          ECR_URL=$(terraform output -raw ecr_repository_url)
          if [ -z "$INSTANCE_ID" ]; then
            echo "Error: Failed to get instance_id from Terraform outputs"
            exit 1
          fi
          if [ -z "$ECR_URL" ]; then
            echo "Error: Failed to get ecr_repository_url from Terraform outputs"
            exit 1
          fi
          echo "INSTANCE_ID=$INSTANCE_ID" > terraform_outputs.env
          echo "ECR_REPOSITORY_URL=$ECR_URL" >> terraform_outputs.env
      - name: Upload Outputs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: terraform_outputs.env

  docker:
    name: Docker Image Build and Push
    runs-on: ubuntu-latest
    needs: terraform
    if: ${{ github.event.inputs.action == 'apply' || github.event_name != 'workflow_dispatch' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Download Outputs Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-outputs

      - name: Load Outputs
        run: |
          . ./terraform_outputs.env
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY_URL=$ECR_REPOSITORY_URL" >> "$GITHUB_ENV"
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Docker Image
        env:
          IMAGE_TAG: latest
        run: |
          docker build -t "$ECR_REPOSITORY_URL:$IMAGE_TAG" .
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$ECR_REPOSITORY_URL"
          docker push "$ECR_REPOSITORY_URL:$IMAGE_TAG"
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [terraform, docker]
    if: ${{ github.event.inputs.action == 'apply' || github.event_name != 'workflow_dispatch' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Download Outputs Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-outputs

      - name: Load Outputs
        run: |
          . ./terraform_outputs.env
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY_URL=$ECR_REPOSITORY_URL" >> "$GITHUB_ENV"
      - name: Deploy Docker Container to EC2
        env:
          IMAGE_TAG: latest
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[*].Instances[*].PublicIpAddress' --output text)
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          ssh -o StrictHostKeyChecking=no -i private_key.pem ec2-user@"$PUBLIC_IP" << EOF
            if ! command -v docker &> /dev/null; then
              sudo yum update -y
              sudo yum install docker -y
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ec2-user
            fi
            newgrp docker
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$ECR_REPOSITORY_URL"
            docker stop my-nginx-app 2>/dev/null || true
            docker rm my-nginx-app 2>/dev/null || true
            docker run -d --name my-nginx-app -p 80:80 "$ECR_REPOSITORY_URL:$IMAGE_TAG"
          EOF
          echo "App is now accessible at: http://$PUBLIC_IP"
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.action == 'destroy' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.3.0
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve